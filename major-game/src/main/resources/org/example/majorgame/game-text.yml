items:
  - id: "apple_juice"
    name: "Apple Juice"

locations:

  # Starter Area


  mud_huzz:
    title: "Mud Hut"
    description:
      - "You are in your mud hut, your home."
  train_station:
    title: "Train Station"
    description:
      - "You are at the trusty ol train station. Here only one train leaves and arrives every day."
  storage_building:
    title: "Storage Building"
    description:
      - "You are in your storage building where your supplies are kept."
    items:
      - "apple_juice"
  arm_chair:
    title: "The Living Room"
    description:
      - "You look at the empty arm chair where your wife used to sit."
      - "Its lonely ever since she died, you didnt dare touch the chair after the day of her funeral."
      - "You hope that maybe some day youll find someone who'll be as perfect as she was."

  # The Illusion of choice

  traunstein:
    title: "TRAUNSTEIN"
    description: [ ]
    autoRouteMessage: "Oops, seems like you fell asleep, you are now at ... HOHE DIRN?!"
    autoRouteDirection: "e"
  grosser_priel:
    title: "GROSSER PRIEL"
    description: [ ]
    autoRouteMessage: "zzzzZZZzzz ... what? .. where am I? ... HOHE DIRN?!"
    autoRouteDirection: "e"

  # Hohe Dirn Campaign

  hohe_dirn:
    title: "HOHE DIRN"
    description:
      - "Welcome the the HOHE DIRN hike."
      - "This is the beginner hike, lets hope you are well stocked in apple juice."
  hd_slums:
    title: "THE SLUMS"
    description:
      - "There seems to be a local, we could ask him."
    dialog:
      - "Major: Mhhhhh, where does the trail start?"
  hd_homeless:
    title: "MEETING THE LOCAL"
    description: []
    dialog:
      - "Major: Salutations gentleman, do you happen to know where the trail to the HOHE DIRN begins?"
      - "Man: Hm ..? You .. you want to go .. up there!!?"
      - "Man: YOU DARE DISTURB THE GODS !!?? YOU WILL NOT BRING DESPAIR UPON THIS VILLAGE !!!"

paths:
  # Starter Area
  mud_huzz:
    n: "train_station|the train station from which you will start your adventures is located."
    e: "storage_building|there is your storage building with your chest."
    w: "arm_chair|you can return to your living room."
  train_station:
    s: "mud_huzz|you can return to your mud hut."
    e: "hohe_dirn|you can attempt the HOHE DIRN hike."
    n: "traunstein|you try your luck in at the TRAUNSTEIN."
    w: "grosser_priel|you can do the hardest tour, the GROSSE PRIEL."
  storage_building:
    w: "mud_huzz|you can return to your mud hut."
  arm_chair:
    e: "mud_huzz|to return to the Mud Hut."
  # The Illusion of Choice
  traunstein:
    e: "hohe_dirn"
  grosser_priel:
    e: "hohe_dirn"
  # Hohe Dirn Campaign
  hohe_dirn:
    n: "hd_slums|awaits the start of your journey. Be careful of the local population, they might be dangerous."
  hd_slums:
    n: "hd_homeless|we can go to the nice looking old man and ask him for directions."
    e: "hd_homeless|there seems to be a small trail, we could just try our luck."

commands:
  instructions:
    - "Available commands are:"
    - "n | s | e | w       -- to go in that direction."
    - "take ITEM           -- to pick up an object."
    - "drop ITEM           -- to put down an object."
    - "drink               -- to drink one apple_juice from inventory."
    - "check               -- to set this place as checkpoint (if allowed)."
    - "clear               -- to clear the dialogue log."
    - "instructions        -- to see this message again."
    - "halt | die          -- to respawn at checkpoint."
