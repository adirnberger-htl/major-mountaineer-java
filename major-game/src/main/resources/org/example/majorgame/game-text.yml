items:

  # Consumables

  - id: "apple_juice"
    name: "Apple Juice"
    category: "consumable"

    # Weapons

  - id: "walking_cane"
    name: "Walking Cane"
    category: "weapon"
    damage: 4
    range: 1

  - id: "pitchfork"
    name: "Pitchfork"
    category: "weapon"
    damage: 4
    range: 2

  - id: "fists"
    name: "Fists"
    category: "weapon"
    damage: 5
    range: 1

  # Other

  - id: "wedding_ring"
    name: "Diamond Wedding Ring"
    category: "other"

locations:

  # ============================================================================
  # TEMPLATE NODES FOR NARRATIVE DESIGN
  # (These serve as templates and reference structures for your new rooms)
  # ============================================================================

  # 1. Dialogue-Heavy Node
  # Demonstrates conversation trees, choices, requirements, rewards, and combat triggers.
  template_dialogue:
    title: "Dialogue Template Node"
    checkpoint: false # Set true to make entering this room the active respawn point
    variables:
      spoke_to_merchant: false # Scoped variables declared at the node level
    description:
      - "This is a template node for an interactive dialogue system."
      - "It demonstrates CYOA branching trees, gated choices, and flag triggers."
    dialogue:
      startNode: "intro" # Entry point node of the conversation
      nodes:
        intro:
          speaker: "Merchant"
          text: "Welcome, adventurer! Would you like to buy this apple juice for 20 Honor?"
          choices:
            - text: "Yes, I will buy it."
              targetNode: "buy_potion"
              requiredHonor: 20 # Option is disabled/locked if player has less honor
              failMessage: "You don't have enough honor to buy this."
            - text: "No thanks, I will keep walking."
              targetNode: "decline_potion"
            - text: "Hand over the juice or prepare to fight!"
              targetNode: "aggressive_fight"
        buy_potion:
          speaker: "Merchant"
          text: "An excellent choice! Here is your juice."
          endDialogue: true # Ends the dialogue
          itemGain: "apple_juice" # Adds item to inventory
          honorCost: 20 # Deducts honor
          setFlags:
            spoke_to_merchant: true # Sets local variable
        decline_potion:
          speaker: "Merchant"
          text: "Safe travels, friend."
          endDialogue: true
          befriended: true # Clears the combat encounter peacefully
        aggressive_fight:
          speaker: "Merchant"
          text: "Guards! Help!"
          endDialogue: true
          startCombat: true # Triggers combat mode (uses the encounter block below)
    # Optional: Combat grid configuration if dialogue ends in startCombat or player attacks
    encounter:
      rows: 3
      cols: 3
      playerStart: { row: 2, col: 0 }
      enemies:
        - id: "merchant_guard"
          name: "Guard"
          maxHp: 15
          weapons: ["walking_cane"]
          row: 1
          col: 2
    paths:
      n: "mud_huzz|return to the Mud Hut."

  # 2. Combat/Fight Node
  # Demonstrates setting up a grid-based encounter where exits are locked until cleared.
  template_fight:
    title: "Combat Template Node"
    description:
      - "This is a template node for a tactical grid-based combat encounter."
      - "Exits are locked automatically until combat is completed."
    encounter:
      rows: 4
      cols: 4
      playerStart: { row: 3, col: 1 } # Player starting cell (0-indexed)
      enemies:
        - id: "template_wolf_1"
          name: "Dire Wolf"
          maxHp: 12
          weapons: ["fists"] # Weapon attack/damage characteristics defined in items section
          row: 1
          col: 2
        - id: "template_wolf_2"
          name: "Young Wolf"
          maxHp: 8
          weapons: ["fists"]
          row: 1
          col: 3
    paths:
      n: "mud_huzz|return to the Mud Hut."

  # 3. Challenge Node
  # Demonstrates balance physics bar, success/failure outcomes, and failTarget teleporting.
  template_challenge:
    title: "Challenge Template Node"
    checkpoint: true # Automatically sets this location as active checkpoint on entry
    variables:
      crossed_bridge: false # Node-local flag
    description:
      - "This is a template node for a balance bar physics mini-game challenge."
    challenge:
      type: "balance_bar" # Mini-game type
      difficulty: "medium" # Physics difficulty: "easy", "medium", "hard"
      onSuccess:
        setFlags:
          crossed_bridge: true # Sets local variable
        itemGain: "apple_juice"
        honorGain: 10
        message: "You balanced carefully across the bridge and made it safely to the other side!"
      onFailure:
        juiceCost: 20 # Depletes canteen
        honorCost: 5
        damage: 10 # Direct health deduction (or death if health <= 0)
        failTarget: "mud_huzz" # Teleport player to this recovery room on failure
        message: "You fell off the bridge and got washed back to your Mud Hut!"
    paths:
      e:
        target: "train_station"
        label: "Proceed east past the bridge"
        requireFlags:
          - "crossed_bridge" # Blocks movement until variable is true
        failMessage: "You must cross the bridge challenge before you can proceed."
      w: "mud_huzz|return to the Mud Hut."

  # ============================================================================

  # Starter Area

  mud_huzz:
    title: "Mud Hut"
    description:
      - "You are in your mud hut, your home."
    paths:
      n: "train_station|the train station from which you will start your adventures is located."
      e: "storage_building|there is your storage building with your chest."
      w: "arm_chair|you can return to your living room."

  train_station:
    title: "Train Station"
    description:
      - "You are at the trusty ol train station. Here only one train leaves and arrives every day."
    paths:
      s: "mud_huzz|you can return to your mud hut."
      e: "hohe_dirn|you can attempt the HOHE DIRN hike."
      n: "traunstein|you try your luck in at the TRAUNSTEIN."
      w: "grosser_priel|you can do the hardest tour, the GROSSE PRIEL."

  storage_building:
    title: "Storage Building"
    description:
      - "You are in your storage building where your supplies are kept."
    items:
      - "apple_juice"
      - "apple_juice"
      - "apple_juice"
    paths:
      w: "mud_huzz|you can return to your mud hut."

  arm_chair:
    title: "The Living Room"
    description:
      - "You look at the empty arm chair where your wife used to sit."
      - "Its lonely ever since she died, you didnt dare touch the chair after the day of her funeral."
      - "You hope that maybe some day you'll find someone who'll be as perfect as she was."
    items:
      - "wedding_ring"
    paths:
      e: "mud_huzz|to return to the Mud Hut."

  # The Illusion of choice

  traunstein:
    title: "TRAUNSTEIN"
    description: [ ]
    autoRouteMessage: "Oops, seems like you fell asleep, you are now at ... HOHE DIRN?!"
    autoRouteDirection: "e"
    paths:
      e: "hohe_dirn"

  grosser_priel:
    title: "GROSSER PRIEL"
    description: [ ]
    autoRouteMessage: "zzzzZZZzzz ... what? .. where am I? ... HOHE DIRN?!"
    autoRouteDirection: "e"
    paths:
      e: "hohe_dirn"

  # Hohe Dirn Campaign

  hohe_dirn:
    title: "HOHE DIRN"
    description:
      - "Welcome the the HOHE DIRN hike."
      - "This is the beginner hike, lets hope you are well stocked in apple juice."
    paths:
      n: "hd_slums|awaits the start of your journey. Be careful of the local population, they might be dangerous."

  hd_slums:
    title: "THE SLUMS"
    description:
      - "There seems to be a local, we could ask him."
    dialog:
      - "Major: Mhhhhh, where does the trail start?"
    paths:
      n: "hd_homeless|we can go to the nice looking old man and ask him for directions."
      e: "hd_small_trail|there seems to be a small trail, we could just try our luck."

  hd_homeless:
    title: "MEETING THE LOCAL"
    description: []
    dialog:
      - "Major: Salutations gentleman, do you happen to know where the trail to the HOHE DIRN begins?"
      - "Man: Hm ..? You .. you want to go .. up there!!?"
      - "Man: YOU DARE DISTURB THE GODS !!?? YOU WILL NOT BRING DESPAIR UPON THIS VILLAGE !!!"
    encounter:
      rows: 4
      cols: 4
      playerStart: { row: 3, col: 1 }
      enemies:
        - id: "old_man_1"
          name: "Old Man"
          maxHp: 18
          movesPerTurn: 1
          weapons: ["walking_cane"]
          row: 1
          col: 3

  hd_small_trail:
    title: "SMALL TRAIL"
    description:
      - "You inspect the trail closer, it seems to be heading in the right direction but there is a big sing warning you it's private property."
      - "It could be a shortcut tho.."
    dialog:
      - "Major: Mmhhh... This doesnt look quite right!"
    paths:
      w: "hd_slums|back to the slums."
      n: "hd_wood_shed|advance on the fishy path."

  hd_wood_shed:
    title: "WOOD SHED"
    description:
      - "There is a wood shed right in front of you."
    dialog:
      - "Farmer: HA?? WHO IS THERE?"
      - "Farmer: This is PRIVATE PROPERTY."
      - "Major: I'm sorry sir... Is this not the path to HOHE DIRN?"
      - "Farmer: YOU WILL NOT PASS!!!!"
    encounter:
      rows: 4
      cols: 4
      playerStart: { row: 3, col: 1 }
      enemies:
        - id: "farmer_1"
          name: "Angry Farmer"
          maxHp: 15
          movesPerTurn: 1
          weapons: ["pitchfork"]
          row: 1
          col: 3
    paths:
      n: "hd_official_start|there is the real beginning."
      s: "hd_small_trail|go back if you're a p*ssy."

  hd_official_start:
    title: "THE TRAIL"
    description:
      - "Aha, there is the trail after all."
    dialog:
      - "Major: Here it is!"
      - "Major: Ohhh, I spy with my little eye.."
    items:
      - "apple_juice"



commands:
  instructions:
    - "Available commands are:"
    - "n | s | e | w       -- to go in that direction."
    - "drink               -- to drink one apple_juice from inventory."
    - "check               -- to set this place as checkpoint (if allowed)."
    - "clear               -- to clear the dialogue log."
    - "instructions        -- to see this message again."
    - "halt | die          -- to respawn at checkpoint."
